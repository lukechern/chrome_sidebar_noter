<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>侧边栏记事本</title>
    <link rel="stylesheet" href="css/sidebar.css">
</head>

<body class="theme-light">
    <!-- 顶部工具栏 -->
    <div class="top_toolbar_7ree">
        <div class="toolbar_left_7ree">
            <button class="toolbar_btn_7ree" id="toggle-notes-panel" title="笔记列表">

            </button>
            <button class="toolbar_btn_7ree" id="search-btn" title="搜索 (Ctrl+F)">

            <button class="toolbar_btn_7ree" id="new-note-btn" title="新建笔记">

                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                </svg>
            </button>
        </div>
        <div class="toolbar_center_7ree">
            <span class="current_note_name_7ree" id="current-note-name">默认笔记</span>
        </div>
        <div class="toolbar_right_7ree">
            <button class="toolbar_btn_7ree" id="note-settings-btn" title="笔记设置">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
                </svg>
            </button>
            <button class="toolbar_btn_7ree" id="global-settings-btn" title="全局设置">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- 笔记列表面板 -->
    <div class="notes_panel_7ree" id="notes-panel">
        <div class="notes_panel_header_7ree">
            <span class="notes_panel_title_7ree">笔记列表</span>
            <button class="notes_panel_close_7ree" id="close-notes-panel">
                <svg viewBox="0 0 24 24" width="16" height="16">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
        </div>
        <div class="notes_list_7ree" id="notes-list"></div>
    </div>

    <!-- 搜索面板 -->
    <div class="search_panel_7ree" id="search-panel" style="display: none;">
        <div class="search_box_7ree">
            <input type="text" class="search_input_7ree" id="search-input" placeholder="搜索笔记内容...">
            <button class="search_btn_7ree" id="search-prev" title="上一个">
                <svg viewBox="0 0 24 24" width="16" height="16">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                </svg>
            </button>
            <button class="search_btn_7ree" id="search-next" title="下一个">
                <svg viewBox="0 0 24 24" width="16" height="16">
                    <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                </svg>
            </button>
            <span class="search_count_7ree" id="search-count">0/0</span>
            <button class="search_btn_7ree" id="search-case-sensitive" title="区分大小写">
                <svg viewBox="0 0 24 24" width="16" height="16">
                    <path d="M19 7v4H5.83l3.58-3.59L8 6l-6 6 6 6 1.41-1.41L5.83 13H21V7z"/>
                </svg>
            </button>
            <button class="search_btn_7ree" id="close-search" title="关闭搜索">
                <svg viewBox="0 0 24 24" width="16" height="16">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
        </div>
        <div class="search_replace_box_7ree" id="search-replace-box" style="display: none;">
            <input type="text" class="search_input_7ree" id="replace-input" placeholder="替换为...">
            <button class="search_btn_7ree" id="replace-one" title="替换">替换</button>
            <button class="search_btn_7ree" id="replace-all" title="全部替换">全部</button>
        </div>
    </div>

    <!-- 搜索结果面板 -->
    <div class="search_results_panel_7ree" id="search-results-panel" style="display: none;">
        <div class="search_results_header_7ree">
            <span class="search_results_title_7ree">搜索结果</span>
            <button class="search_results_close_7ree" id="close-search-results">
                <svg viewBox="0 0 24 24" width="16" height="16">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
        </div>
        <div class="search_results_list_7ree" id="search-results-list"></div>
    </div>

    <!-- 编辑器容器 -->
    <div id="editor-container"></div>

    <!-- 底部状态栏 -->
    <div class="statusbar_7ree">
        <div class="statusbar_left_7ree">
            <span id="last-save-time">从未保存</span>
        </div>
        <div class="statusbar_center_7ree">
            <span id="editor-language">plaintext</span>
            <span class="statusbar_separator_7ree">|</span>
            <span id="editor-lines">0 行</span>
            <span class="statusbar_separator_7ree">|</span>
            <span id="editor-position">Ln 1, Col 1</span>
        </div>
        <div class="statusbar_right_7ree">
            <div class="statusbar_icon_7ree" id="save-icon" title="保存 (Ctrl+S)">
                <svg viewBox="0 0 24 24">
                    <path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.11 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z" />
                </svg>
            </div>
            <div class="statusbar_icon_7ree lock-icon_7ree" id="lock-icon" title="未加密">
                <svg viewBox="0 0 24 24">
                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
            </div>
        </div>
    </div>

    <!-- 全局设置对话框 -->
    <div class="settings_dialog_7ree" id="global-settings-dialog" style="display: none;">
        <div class="settings_content_7ree settings_large_7ree">
            <div class="settings_header_7ree">
                <span class="settings_title_7ree">全局设置</span>
                <button class="settings_close_7ree" id="close-global-settings">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </div>
            
            <div class="settings_tabs_7ree">
                <button class="settings_tab_btn_7ree active" data-settings-tab="appearance">外观</button>
                <button class="settings_tab_btn_7ree" data-settings-tab="editor">编辑器</button>
                <button class="settings_tab_btn_7ree" data-settings-tab="storage">存储</button>
                <button class="settings_tab_btn_7ree" data-settings-tab="advanced">高级</button>
            </div>

            <div class="settings_tab_content_7ree" id="settings-tab-appearance">
                <div class="settings_item_7ree">
                    <label>主题模式</label>
                    <div class="theme_selection_container_7ree">
                        <div class="theme_label_container_7ree">
                            <span class="theme_text_7ree">明亮</span>
                            <label class="theme_switch_7ree">
                                <input type="checkbox" id="global-theme-switch">
                                <span class="theme_slider_7ree"></span>
                            </label>
                            <span class="theme_text_7ree">暗黑</span>
                        </div>
                    </div>
                </div>
                <div class="settings_item_7ree">
                    <label>自动保存间隔</label>
                    <div class="auto_save_container_7ree">
                        <div class="auto_save_control_7ree">
                            <input type="range" class="auto_save_slider_7ree" id="auto-save-slider" min="1" max="60" value="3">
                            <span class="slider_value_7ree" id="auto-save-value">3 秒</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="settings_tab_content_7ree" id="settings-tab-editor" style="display: none;">
                <div class="settings_item_7ree">
                    <label for="default-language">默认语言</label>
                    <select id="default-language" class="settings_select_7ree">
                        <option value="plaintext">纯文本</option>
                        <option value="markdown">Markdown</option>
                        <option value="javascript">JavaScript</option>
                        <option value="typescript">TypeScript</option>
                        <option value="python">Python</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="json">JSON</option>
                        <option value="sql">SQL</option>
                        <option value="java">Java</option>
                        <option value="cpp">C++</option>
                        <option value="csharp">C#</option>
                        <option value="php">PHP</option>
                        <option value="ruby">Ruby</option>
                        <option value="go">Go</option>
                        <option value="rust">Rust</option>
                        <option value="swift">Swift</option>
                        <option value="kotlin">Kotlin</option>
                        <option value="shell">Shell</option>
                        <option value="yaml">YAML</option>
                        <option value="xml">XML</option>
                    </select>
                </div>
                <div class="settings_item_7ree">
                    <label for="default-font-size">默认字体大小</label>
                    <select id="default-font-size" class="settings_select_7ree">
                        <option value="10">10px</option>
                        <option value="11">11px</option>
                        <option value="12">12px</option>
                        <option value="13">13px</option>
                        <option value="14" selected>14px</option>
                        <option value="15">15px</option>
                        <option value="16">16px</option>
                        <option value="17">17px</option>
                        <option value="18">18px</option>
                        <option value="20">20px</option>
                        <option value="22">22px</option>
                        <option value="24">24px</option>
                    </select>
                </div>
                <div class="settings_item_7ree">
                    <label for="default-line-height">默认行高</label>
                    <select id="default-line-height" class="settings_select_7ree">
                        <option value="18">紧凑</option>
                        <option value="22">较紧凑</option>
                        <option value="26" selected>正常</option>
                        <option value="30">较宽松</option>
                        <option value="34">宽松</option>
                    </select>
                </div>
                <div class="settings_item_7ree">
                    <label>显示行号</label>
                    <label class="switch_7ree">
                        <input type="checkbox" id="show-line-numbers" checked>
                        <span class="slider_7ree"></span>
                    </label>
                </div>
                <div class="settings_item_7ree">
                    <label>显示小地图</label>
                    <label class="switch_7ree">
                        <input type="checkbox" id="show-minimap">
                        <span class="slider_7ree"></span>
                    </label>
                </div>
            </div>

            <div class="settings_tab_content_7ree" id="settings-tab-storage" style="display: none;">
                <div class="settings_item_7ree">
                    <label>备份数量</label>
                    <select id="backup-count" class="settings_select_7ree">
                        <option value="3">3 个</option>
                        <option value="5" selected>5 个</option>
                        <option value="10">10 个</option>
                    </select>
                </div>
                <div class="settings_item_7ree">
                    <button id="export-data-btn" class="btn_primary_7ree">导出所有数据</button>
                </div>
                <div class="settings_item_7ree">
                    <button id="import-data-btn" class="btn_secondary_7ree">导入数据</button>
                    <input type="file" id="import-data-input" style="display: none;" accept=".json">
                </div>
                <div class="settings_item_7ree">
                    <button id="clear-all-data-btn" class="btn_danger_7ree">清空所有数据</button>
                </div>
            </div>

            <div class="settings_tab_content_7ree" id="settings-tab-advanced" style="display: none;">
                <div class="settings_item_7ree">
                    <label for="tab1-name">标签一名称</label>
                    <input type="text" id="tab1-name" value="文本中转站">
                </div>
                <div class="settings_item_7ree">
                    <label for="exchange-url">标签一网址</label>
                    <input type="text" id="exchange-url" value="">
                </div>
                <div class="settings_item_7ree">
                    <label for="tab2-name">标签二名称</label>
                    <input type="text" id="tab2-name" value="云剪贴板">
                </div>
                <div class="settings_item_7ree">
                    <label for="clipboard-url">标签二网址</label>
                    <input type="text" id="clipboard-url" value="">
                </div>
                <div class="settings_item_7ree">
                    <button id="clear-cache-btn" class="btn_secondary_7ree">清空网址缓存</button>
                </div>
            </div>

            <div class="settings_footer_7ree">
                <button id="save-global-settings" class="btn_primary_7ree">保存设置</button>
                <button id="cancel-global-settings" class="btn_secondary_7ree">取消</button>
            </div>
        </div>
    </div>

    <!-- 笔记设置对话框 -->
    <div class="settings_dialog_7ree" id="note-settings-dialog" style="display: none;">
        <div class="settings_content_7ree">
            <div class="settings_header_7ree">
                <span class="settings_title_7ree">笔记设置</span>
                <button class="settings_close_7ree" id="close-note-settings">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </div>

            <div class="settings_item_7ree">
                <label for="note-name">笔记名称</label>
                <input type="text" id="note-name" value="">
            </div>

            <div class="settings_item_7ree">
                <label for="note-language">语言</label>
                <select id="note-language" class="settings_select_7ree">
                    <option value="plaintext">纯文本</option>
                    <option value="markdown">Markdown</option>
                    <option value="javascript">JavaScript</option>
                    <option value="typescript">TypeScript</option>
                    <option value="python">Python</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="json">JSON</option>
                    <option value="sql">SQL</option>
                    <option value="java">Java</option>
                    <option value="cpp">C++</option>
                    <option value="csharp">C#</option>
                    <option value="php">PHP</option>
                    <option value="ruby">Ruby</option>
                    <option value="go">Go</option>
                    <option value="rust">Rust</option>
                    <option value="swift">Swift</option>
                    <option value="kotlin">Kotlin</option>
                    <option value="shell">Shell</option>
                    <option value="yaml">YAML</option>
                    <option value="xml">XML</option>
                </select>
            </div>

            <div class="settings_item_7ree">
                <label for="note-font-size">字体大小</label>
                <select id="note-font-size" class="settings_select_7ree">
                    <option value="10">10px</option>
                    <option value="11">11px</option>
                    <option value="12">12px</option>
                    <option value="13">13px</option>
                    <option value="14" selected>14px</option>
                    <option value="15">15px</option>
                    <option value="16">16px</option>
                    <option value="17">17px</option>
                    <option value="18">18px</option>
                    <option value="20">20px</option>
                    <option value="22">22px</option>
                    <option value="24">24px</option>
                </select>
            </div>

            <div class="settings_item_7ree">
                <label for="note-line-height">行高</label>
                <select id="note-line-height" class="settings_select_7ree">
                    <option value="18">紧凑</option>
                    <option value="22">较紧凑</option>
                    <option value="26" selected>正常</option>
                    <option value="30">较宽松</option>
                    <option value="34">宽松</option>
                </select>
            </div>

            <div class="settings_item_7ree">
                <label>加密保护</label>
                <div class="encryption_controls_7ree">
                    <label class="switch_7ree">
                        <input type="checkbox" id="note-encrypted">
                        <span class="slider_7ree"></span>
                    </label>
                    <div id="encryption-password-container" style="display: none; margin-top: 10px;">
                        <input type="password" id="note-password" placeholder="设置密码" style="margin-right: 8px; width: 120px;">
                        <input type="password" id="note-password-confirm" placeholder="确认密码" style="width: 120px;">
                    </div>
                </div>
            </div>

            <div class="settings_footer_7ree">
                <button id="save-note-settings" class="btn_primary_7ree">保存</button>
                <button id="cancel-note-settings" class="btn_secondary_7ree">取消</button>
                <button id="delete-note-btn" class="btn_danger_7ree" style="margin-left: auto;">删除笔记</button>
            </div>
        </div>
    </div>

    <!-- 密码输入对话框 -->
    <div class="settings_dialog_7ree" id="password-dialog" style="display: none;">
        <div class="settings_content_7ree">
            <div class="settings_header_7ree">
                <span class="settings_title_7ree">输入密码</span>
            </div>
            <div class="settings_item_7ree">
                <label>此笔记已加密，请输入密码解锁</label>
                <input type="password" id="unlock-password" placeholder="请输入密码" autocomplete="off">
                <p class="error_message_7ree" id="password-error" style="display: none; color: #f44336; margin-top: 8px;">密码错误</p>
            </div>
            <div class="settings_footer_7ree">
                <button id="unlock-note-btn" class="btn_primary_7ree">解锁</button>
                <button id="cancel-unlock-btn" class="btn_secondary_7ree">取消</button>
            </div>
        </div>
    </div>

    <!-- 自定义确认对话框 -->
    <div class="confirm_dialog_7ree" id="confirm-dialog" style="display: none;">
        <div class="confirm_content_7ree">
            <div class="confirm_message_7ree" id="confirm-message">确定要执行此操作吗？</div>
            <div class="confirm_buttons_7ree">
                <button id="confirm-yes" class="confirm_button_7ree yes">确定</button>
                <button id="confirm-no" class="confirm_button_7ree no">取消</button>
            </div>
        </div>
    </div>

    <!-- 顶部标签栏（用于iframe标签） -->
    <div class="tabs_bar_7ree" id="tabs-bar" style="display: none;">
        <div class="tab_item_7ree active" data-tab="noter">

    <!-- 配置 Monaco Environment - 必须在加载 Monaco 主模块之前设置 -->
    <script>
        // 同时设置 window 和 self，确保 Monaco 在任何作用域都能读取到
        (function() {
            var monacoEnv = {
                getWorkerUrl: function (moduleId, label) {
                    // 返回 null 禁用 Web Worker
                    return null;
                },
                createWorker: function (moduleId, label) {
                    // 返回空的 Worker 存根，避免创建失败
                    return {
                        postMessage: function() {},
                        addEventListener: function() {},
                        removeEventListener: function() {},
                        terminate: function() {}
                    };
                }
            };
            
            // 设置到所有可能的作用域
            if (typeof window !== 'undefined') {
                window.MonacoEnvironment = monacoEnv;
            }
            if (typeof self !== 'undefined') {
                self.MonacoEnvironment = monacoEnv;
            }
            if (typeof globalThis !== 'undefined') {
                globalThis.MonacoEnvironment = monacoEnv;
            }
        })();
    </script>
